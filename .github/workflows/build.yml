name: Build Stockfish — CLANG Windows

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit to build. If empty - build current.'
        required: false
        default: ''   

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Per-architecture build ───────────────────────────────────────────────
  build:
    name: Windows x64 · ${{ matrix.arch }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64-universal
          - arch: x86-64-avx512icl
          - arch: x86-64-vnni512
          - arch: x86-64-avx512
          - arch: x86-64-avxvnni
          - arch: x86-64-bmi2
          - arch: x86-64-avx2
          - arch: x86-64-sse41-popcnt
          - arch: x86-64

    steps:
      - name: Checkout official-stockfish/Stockfish
        uses: actions/checkout@v4
        with:
          repository: official-stockfish/Stockfish
          ref: ${{ inputs.commit }}
          submodules: recursive

      - name: Determine version
        id: version
        shell: bash
        run: |
          DATE=$(git log -1 --format=%cd --date=format:%Y%m%d)
          SHA=$(git rev-parse --short=8 HEAD)
          echo "version=dev-${DATE}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          cache: true
          install: >-
            mingw-w64-clang-x86_64-toolchain
            make
            git

      - name: Set up Intel SDE
        uses: petarpetrovt/setup-sde@v6.0
        with:
          environmentVariableName: SDE_PATH

      - name: Build ${{ matrix.arch }} binary (PGO)
        shell: msys2 {0}
        env:
          SDE_PATH: ${{ env.SDE_PATH }}
        run: |
          cd src
          # Convert the Windows SDE path into an MSYS2-style path so the
          # MSYS2 shell can resolve it as RUN_PREFIX for profile-build.
          SDE_DIR=$(cygpath -u "${SDE_PATH}")
          # On Windows, SDE ships a single sde.exe that transparently handles
          # both 32- and 64-bit targets (sde64 is a Linux-only binary name).
          SDE_BIN="${SDE_DIR}/sde.exe"

          # Sanity-check the binary actually exists at the resolved path
          # before handing it to make, so failures are obvious immediately.
          if [ ! -f "$SDE_BIN" ]; then
            echo "::error::sde.exe not found at $SDE_BIN"
            ls -la "$SDE_DIR"
            exit 1
          fi

          make -j$(nproc) COMP=clang ARCH=${{ matrix.arch }} profile-build \
            RUN_PREFIX="${SDE_BIN} -future --"

      - name: Strip debug symbols
        shell: msys2 {0}
        run: llvm-strip src/Stockfish.exe

      - name: Upload artifact · ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: Stockfish-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}
          path: src/Stockfish.exe
          if-no-files-found: error
          retention-days: 30
